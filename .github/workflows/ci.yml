name: CI

# Lint, type check and test on every push and pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The tests need PostgreSQL, and the comparison tests (miniredis/tests/test_compat_real_redis.py,
    # part of test_pubsub.py) need a real Redis to compare MiniRedis against. Without it they skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortlink
          POSTGRES_PASSWORD: shortlink
          POSTGRES_DB: shortlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy api miniredis bench

      - name: Create the database tables
        run: alembic upgrade head

      - name: Test
        run: pytest --cov=api --cov=miniredis --cov-report=term-missing --cov-fail-under=90
