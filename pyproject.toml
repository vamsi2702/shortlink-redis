[project]
name = "shortlink-redis"
version = "0.1.0"
description = "URL shortener (FastAPI + PostgreSQL) with a Redis-compatible cache server written from scratch"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pyjwt",
    "bcrypt",
    "email-validator",
    "redis",  # the client the API uses to talk to MiniRedis
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[tool.setuptools]
packages = ["miniredis", "api", "bench"]

[tool.pytest.ini_options]
testpaths = ["miniredis/tests", "api/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["api/migrations"]  # auto-generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
